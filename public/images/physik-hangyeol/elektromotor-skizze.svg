<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <rect width="560" height="420" fill="#f7f4ef"/>
  <text x="280" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Elektromotor - drei Bestandteile</text>

  <defs>
    <marker id="arrF" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="70" y="90" width="50" height="160" rx="4" fill="#c53030" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="175" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="system-ui,sans-serif">N</text>

  <rect x="440" y="90" width="50" height="160" rx="4" fill="#2b6cb0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="465" y="175" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="system-ui,sans-serif">S</text>

  <text x="95" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#c53030" font-family="system-ui,sans-serif">1 Dauermagnet</text>
  <text x="465" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6cb0" font-family="system-ui,sans-serif">1 Dauermagnet</text>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#666" font-family="system-ui,sans-serif">(Feldmagnet / Stator)</text>

  <g fill="none" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrF)">
    <path d="M120 120 L440 120"/>
    <path d="M120 170 L440 170"/>
    <path d="M120 220 L440 220"/>
  </g>

  <g transform="translate(280 170)">
    <rect x="-70" y="-28" width="140" height="56" rx="3" fill="#fff8dc" stroke="#b7791f" stroke-width="2.2"/>
    <path d="M-55 -18 Q -40 -28, -25 -18 Q -10 -8, 5 -18 Q 20 -28, 35 -18 Q 50 -8, 55 -18" fill="none" stroke="#b7791f" stroke-width="1.4"/>
    <path d="M-55 18 Q -40 8, -25 18 Q -10 28, 5 18 Q 20 8, 35 18 Q 50 28, 55 18" fill="none" stroke="#b7791f" stroke-width="1.4"/>
    <text y="6" text-anchor="middle" font-size="13" font-weight="700" fill="#744210" font-family="system-ui,sans-serif">Spule / Anker</text>
  </g>
  <text x="280" y="248" text-anchor="middle" font-size="11" font-weight="600" fill="#b7791f" font-family="system-ui,sans-serif">2 Spule (Rotor) - Lorentz-Kraft dreht</text>

  <line x1="280" y1="100" x2="280" y2="300" stroke="#4a5568" stroke-width="3"/>
  <circle cx="280" cy="170" r="6" fill="#4a5568"/>

  <g transform="translate(280 300)">
    <circle cx="0" cy="0" r="28" fill="#e2e8f0" stroke="#2d3748" stroke-width="2"/>
    <path d="M0,-28 A28,28 0 0,1 0,28" fill="#a0aec0"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#2d3748" stroke-width="2"/>
    <rect x="-42" y="-8" width="14" height="16" fill="#718096" stroke="#1a1a1a"/>
    <rect x="28" y="-8" width="14" height="16" fill="#718096" stroke="#1a1a1a"/>
    <line x1="-60" y1="0" x2="-42" y2="0" stroke="#c53030" stroke-width="2.5"/>
    <line x1="42" y1="0" x2="60" y2="0" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="-68" y="5" text-anchor="end" font-size="12" font-weight="700" fill="#c53030" font-family="system-ui,sans-serif">+</text>
    <text x="68" y="5" text-anchor="start" font-size="12" font-weight="700" fill="#2b6cb0" font-family="system-ui,sans-serif">-</text>
  </g>
  <text x="280" y="350" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3748" font-family="system-ui,sans-serif">3 Kommutator (Stromwender) + Schleifkontakte</text>

  <rect x="40" y="368" width="480" height="40" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="280" y="393" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="#333">1 Feld / 2 drehende Spule / 3 Stromrichtung umkehren = Dauerrotation</text>
</svg>
