  <rect x="230" y="80" width="55" height="36" fill="#c53030" stroke="#1a1a1a"/><text x="257" y="104" text-anchor="middle" fill="#fff" font-weight="700" font-size="16" font-family="system-ui,sans-serif">N</text>
