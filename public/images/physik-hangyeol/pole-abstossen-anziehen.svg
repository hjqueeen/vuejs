  <rect x="430" y="170" width="55" height="36" fill="#c53030" stroke="#1a1a1a"/><text x="457" y="194" text-anchor="middle" fill="#fff" font-weight="700" font-size="16" font-family="system-ui,sans-serif">N</text>
  <text x="400" y="230" text-anchor="middle" font-size="12" fill="#276749" font-family="system-ui,sans-serif">S î N ziehen sich an</text>
  <text x="260" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#444">Gleichartig abstoﬂen ∑ Verschiedenartig anziehen</text>
