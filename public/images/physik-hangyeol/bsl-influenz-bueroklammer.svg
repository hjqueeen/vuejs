="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g><g transform="translate(510 323) rotate(-30) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="20" y="0" width="20" height="14" fill="#c53030" stroke="#1a1a1a"/><text x="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g>
  <text x="530" y="380" text-anchor="middle" font-size="12" fill="#744210" font-family="system-ui,sans-serif">Elementarmagnete wieder ungeordnet</text>
  <text x="530" y="398" text-anchor="middle" font-size="12" fill="#744210" font-family="system-ui,sans-serif">-&gt; magnetische Wirkung weg (magnetisch weich)</text>

  <rect x="80" y="425" width="560" height="40" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="360" y="450" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#333">Influenz = Magnetisierung durch aeusseres Feld (temporaer bei weichem Stahl)</text>
</svg>
