<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <rect width="720" height="480" fill="#f7f4ef"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">BSL Aufgabe 4 - Magnetische Influenz (Bueroklammer)</text>
  <text x="360" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">Elementarmagnete in der Bueroklammer</text>

  <!-- ========== a) im Feld ========== -->
  <text x="180" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#276749">a) im Magnetfeld des Dauermagneten</text>

  <!-- Dauermagnet left -->
  <rect x="30" y="150" width="50" height="130" fill="#c53030" stroke="#1a1a1a" stroke-width="1.4"/>
  <rect x="30" y="280" width="50" height="60" fill="#2b6cb0" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="55" y="220" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">N</text>
  <text x="55" y="318" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">S</text>
  <text x="55" y="140" text-anchor="middle" font-size="11" fill="#444" font-family="system-ui,sans-serif">Dauermagnet</text>

  <!-- field lines hint -->
  <g fill="none" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="3 3">
    <path d="M80 170 C 110 170, 110 170, 140 170"/>
    <path d="M80 210 C 110 210, 110 210, 140 210"/>
    <path d="M80 250 C 110 250, 110 250, 140 250"/>
  </g>

  <!-- Bueroklammer outline (simplified paperclip shape as rounded rect stack) -->
  <rect x="140" y="145" width="160" height="210" rx="18" fill="#e8eef5" stroke="#4a5568" stroke-width="2.2"/>
  <text x="220" y="168" text-anchor="middle" font-size="11" fill="#4a5568" font-family="system-ui,sans-serif">Bueroklammer</text>

  <!-- aligned mini magnets N->S (pointing toward Dauermagnet N attracts S of clip end near N... 
       Near N of permanent magnet, the near end of soft iron becomes S (attraction of opposite).
       So elementarmagnets: S end toward Dauermagnet N, N end away.
       Layout: each mini bar horizontal with S(left, blue) N(right, red) so S faces Dauermagnet N -->
  <!-- row of aligned Elementarmagnete: S | N   S | N ... with S facing left (toward Dauermagnet N) -->
<rect x="155" y="185" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="183" y="185" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="169" y="197" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="197" y="197" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="215" y="185" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="243" y="185" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="229" y="197" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="257" y="197" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="155" y="215" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="183" y="215" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="169" y="227" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="197" y="227" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="215" y="215" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="243" y="215" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="229" y="227" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="257" y="227" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="155" y="245" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="183" y="245" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="169" y="257" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="197" y="257" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="215" y="245" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="243" y="245" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="229" y="257" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="257" y="257" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="155" y="275" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="183" y="275" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="169" y="287" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="197" y="287" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="215" y="275" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="243" y="275" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="229" y="287" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="257" y="287" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="155" y="305" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="183" y="305" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="169" y="317" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="197" y="317" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text><rect x="215" y="305" width="28" height="16" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="243" y="305" width="28" height="16" fill="#c53030" stroke="#1a1a1a"/><text x="229" y="317" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="257" y="317" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">N</text>
  <text x="220" y="380" text-anchor="middle" font-size="12" fill="#276749" font-family="system-ui,sans-serif">Elementarmagnete ausgerichtet</text>
  <text x="220" y="398" text-anchor="middle" font-size="12" fill="#276749" font-family="system-ui,sans-serif">-&gt; Klammer wird selbst magnetisch / angezogen</text>

  <!-- ========== b) ausserhalb ========== -->
  <text x="530" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#744210">b) ausserhalb des Magnetfelds</text>

  <rect x="450" y="145" width="160" height="210" rx="18" fill="#e8eef5" stroke="#4a5568" stroke-width="2.2"/>
  <text x="530" y="168" text-anchor="middle" font-size="11" fill="#4a5568" font-family="system-ui,sans-serif">Bueroklammer</text>
<g transform="translate(490 198) rotate(25) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="20" y="0" width="20" height="14" fill="#c53030" stroke="#1a1a1a"/><text x="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g><g transform="translate(540 193) rotate(-40) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="20" y="0" width="20" height="14" fill="#c53030" stroke="#1a1a1a"/><text x="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g><g transform="translate(580 208) rotate(70) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="20" y="0" width="20" height="14" fill="#c53030" stroke="#1a1a1a"/><text x="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g><g transform="translate(495 238) rotate(-15) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill="#2b6cb0" stroke="#1a1a1a"/><rect x="20" y="0" width="20" height="14" fill="#c53030" stroke="#1a1a1a"/><text x="10" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">S</text><text x="30" y="11" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">N</text></g><g transform="translate(545 243) rotate(100) translate(-20 -8)"><rect x="0" y="0" width="20" height="14" fill=