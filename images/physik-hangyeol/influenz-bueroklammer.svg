<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300">
  <rect width="540" height="300" fill="#f7f4ef"/>
  <text x="270" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Magnetische Influenz · Büroklammer</text>
  <!-- ohne -->
  <text x="135" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#744210" font-family="system-ui,sans-serif">a) ohne Magnetfeld</text>
  <rect x="50" y="70" width="170" height="120" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <g stroke="#4a5568" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="100" x2="100" y2="120"/>
    <line x1="130" y1="95" x2="120" y2="125"/>
    <line x1="160" y1="110" x2="180" y2="100"/>
    <line x1="90" y1="145" x2="115" y2="155"/>
    <line x1="145" y1="140" x2="170" y2="155"/>
    <line x1="100" y1="165" x2="90" y2="180"/>
  </g>
  <text x="135" y="215" text-anchor="middle" font-size="12" fill="#744210" font-family="system-ui,sans-serif">Elementarmagnete ungeordnet</text>
  <!-- mit -->
  <text x="400" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#276749" font-family="system-ui,sans-serif">b) mit Magnetfeld</text>
  <rect x="290" y="70" width="140" height="120" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <g stroke="#c53030" stroke-width="2.2" stroke-linecap="round">
    <line x1="310" y1="100" x2="400" y2="100"/>
    <line x1="310" y1="120" x2="400" y2="120"/>
    <line x1="310" y1="140" x2="400" y2="140"/>
    <line x1="310" y1="160" x2="400" y2="160"/>
  </g>
  <!-- magnet -->
  <rect x="450" y="95" width="28" height="70" fill="#5a6a7a" stroke="#1a1a1a"/>
  <rect x="450" y="90" width="28" height="18" fill="#c53030" stroke="#1a1a1a"/>
  <rect x="450" y="155" width="28" height="18" fill="#2b6cb0" stroke="#1a1a1a"/>
  <text x="464" y="103" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="system-ui,sans-serif">N</text>
  <text x="464" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="system-ui,sans-serif">S</text>
  <text x="464" y="140" text-anchor="middle" font-size="9" fill="#fff" font-family="system-ui,sans-serif" transform="rotate(-90 464 140)">Magnet</text>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#276749" font-family="system-ui,sans-serif">ausgerichtet ’ selbst magnetisch</text>
  <text x="270" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#444">Influenz = Magnetisierung durch äußeres Feld</text>
</svg>
