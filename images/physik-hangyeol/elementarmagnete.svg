<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <rect width="520" height="280" fill="#f7f4ef"/>
  <text x="260" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Modell der Elementarmagnete</text>
  <!-- ungeordnet -->
  <rect x="40" y="55" width="180" height="160" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#744210" font-family="system-ui,sans-serif">ungeordnet · unmagnetisch</text>
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="110" x2="95" y2="125"/>
    <line x1="120" y1="100" x2="110" y2="130"/>
    <line x1="150" y1="115" x2="175" y2="105"/>
