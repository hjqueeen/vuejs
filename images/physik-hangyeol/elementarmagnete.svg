  <text x="340" y="200" font-size="11" fill="#c53030" font-family="system-ui,sans-serif">N’</text>
  <text x="430" y="200" font-size="11" fill="#2b6cb0" font-family="system-ui,sans-serif">S</text>
  <text x="260" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#444">Wirkungen heben sich auf  |  Körper wirkt als Magnet</text>
