    <line x1="110" y1="185" x2="135" y2="195"/>
    <line x1="160" y1="130" x2="180" y2="150"/>
  </g>
  <!-- geordnet -->
  <rect x="300" y="55" width="180" height="160" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="390" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#276749" font-family="system-ui,sans-serif">ausgerichtet · magnetisch</text>
  <g stroke="#c53030" stroke-width="2.5" stroke-linecap="round">
    <line x1="320" y1="110" x2="360" y2="110"/><polygon points="360,110 352,105 352,115" fill="#c53030"/>
    <line x1="320" y1="130" x2="360" y2="130"/><polygon points="360,130 352,125 352,135" fill="#c53030"/>
    <line x1="320" y1="150" x2="360" y2="150"/><polygon points="360,150 352,145 352,155" fill="#c53030"/>
    <line x1="320" y1="170" x2="360" y2="170"/><polygon points="360,170 352,165 352,175" fill="#c53030"/>
    <line x1="380" y1="110" x2="420" y2="110"/><polygon points="420,110 412,105 412,115" fill="#c53030"/>
    <line x1="380" y1="130" x2="420" y2="130"/><polygon points="420,130 412,125 412,135" fill="#c53030"/>
    <line x1="380" y1="150" x2="420" y2="150"/><polygon points="420,150 412,145 412,155" fill="#c53030"/>
    <line x1="380" y1="170" x2="420" y2="170"/><polygon points="420,170 412,165 412,175" fill="#c53030"/>
