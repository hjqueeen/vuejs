<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <rect width="520" height="280" fill="#f7f4ef"/>
  <text x="260" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Offener vs. geschlossener Eisenkern</text>
  <!-- offen -->
  <text x="130" y="55" text-anchor="middle" font-size="13" font-weight="600" font-family="system-ui,sans-serif">offener Eisenkern</text>
  <rect x="90" y="80" width="30" height="120" fill="#718096" stroke="#1a1a1a"/>
  <ellipse cx="105" cy="100" rx="35" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="105" cy="120" rx="35" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="105" cy="140" rx="35" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="105" cy="160" rx="35" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g fill="none" stroke="#dd6b20" stroke-width="1.5">
    <path d="M105 70 C 40 90, 40 190, 105 210"/>
    <path d="M105 70 C 170 90, 170 190, 105 210"/>
  </g>
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#744210" font-family="system-ui,sans-serif">Linien treten nach außen</text>
  <!-- geschlossen -->
  <text x="380" y="55" text-anchor="middle" font-size="13" font-weight="600" font-family="system-ui,sans-serif">geschlossener Eisenkern</text>
  <rect x="300" y="90" width="160" height="100" fill="none" stroke="#718096" stroke-width="18" rx="8"/>
  <ellipse cx="320" cy="110" rx="28" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="320" cy="128" rx="28" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="320" cy="146" rx="28" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="320" cy="164" rx="28" ry="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g fill="none" stroke="#276749" stroke-width="2">
    <path d="M320 100 L440 100 L440 180 L320 180" stroke-dasharray="6 3"/>
  </g>
  <text x="380" y="245" text-anchor="middle" font-size="11" fill="#276749" font-family="system-ui,sans-serif">Linien bleiben im Kern ’ stärkeres Feld</text>
</svg>
